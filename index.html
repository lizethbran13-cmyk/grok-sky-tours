<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2a78e4">
<title>Grok Snowie Sky Tours</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=st7">
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/addons/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
  <div id="hTL"><div id="hArea" class="chip">🚁 Heliport</div><div id="hGoal"></div><div id="hAlt" class="chip"></div><div id="hStat" class="chip"></div></div>
  <div id="hTR"><div class="chip">📸 <b id="hTours">0/0</b></div><div class="chip">🐾 <b id="hRes">0/6</b></div></div>
  <button id="hPause" aria-label="pilot's log">📒</button>
  <button id="hMap" aria-label="map">🗺️</button>
  <button id="hTow" aria-label="call the tow drone">🛸<small>TOW</small></button>
  <button id="hView" aria-label="switch camera">👁️</button>
</div>
<div id="touch" class="hidden">
  <div id="touchZone"></div><div id="stickRing"></div><div id="stickKnob"></div>
  <button class="tb" id="tJump" data-b="jump">▲</button>
  <button class="tb" id="tDown" data-b="spin">▼</button>
  <button class="hidden" id="tAct" data-b="act"></button>
</div>
<div id="flash"></div>
<div id="dlg"></div>
<div id="ui"></div>
<div id="toast"></div>
<div id="loading"><div class="lg">GROK<br><span>SNOWIE SKY TOURS</span></div><div class="bar"><i id="loadBar"></i></div><p id="loadTxt">Loading…</p></div>
<script type="module" src="js/main.js?v=st7"></script>
</body>
</html>
